name = "phoenix-cf-container"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

[[containers]]
class_name = "ElixirContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "ELIXIR_CONTAINER"
class_name = "ElixirContainer"

[exports.ElixirContainer]
type = "durable-object"
storage = "sqlite"
