name = "phoenix-cf-container"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Required for ctx.exports, used to construct the D1Gateway entrypoint that the
# Durable Object hands to container.interceptOutboundHttp(). See src/index.ts.
compatibility_flags = ["enable_ctx_exports"]

[observability]
enabled = true

[[containers]]
class_name = "ElixirContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "ELIXIR_CONTAINER"
class_name = "ElixirContainer"

[exports.ElixirContainer]
type = "durable-object"
storage = "sqlite"

# Cloudflare D1 database (backs the /tasks and /chat demos).
#
# Working from a fork means pointing this at your own database:
#   1. pnpm exec wrangler d1 create phoenix-cf-container-db
#   2. Replace database_id below with the id printed above.
#   3. pnpm exec wrangler d1 migrations apply phoenix-cf-container-db --remote
#   4. Redeploy the Worker (CI on push to main, or wrangler deploy).
#
# Remove this block and the Worker skips the gateway entirely: /tasks shows a
# setup notice and /chat runs in ephemeral mode. Nothing else changes.
[[d1_databases]]
# The Worker (src/index.ts) reads this binding as `env.DB` and only registers
# the private D1 gateway when it exists — keep the name "DB".
binding = "DB"
database_name = "phoenix-cf-container-db"
database_id = "af1cbfce-87d4-4a3c-ab2d-60a49db70ece"
migrations_dir = "cloudflare/migrations"
# Cloudflare Email Service binding, used by MailGateway (src/index.ts) to send
# account email on the container's behalf. The container never holds a
# credential — it POSTs to http://mail.internal/send and the Worker does the
# sending, the same arrangement the D1 binding uses above.
#
# Before this can deliver anything:
#   1. pnpm exec wrangler email sending enable mail.<your-domain>
#   2. Add the DNS records it asks for (pnpm exec wrangler email sending dns)
#   3. pnpm exec wrangler secret put MAIL_FROM   # e.g. auth@mail.<your-domain>
#
# MAIL_FROM is the switch for the whole path: until it is set, the binding goes
# unused, the intercept is never registered, and Phoenix keeps the mail-
# dependent flows hidden. Once the domain is onboarded, pin the sender at the
# platform level too by adding:
#
#   allowed_sender_addresses = ["auth@mail.<your-domain>"]
#
[[send_email]]
name = "EMAIL"
